name: IAIS image (ghcr)
# Builds the IAIS fork of Rallly for linux/amd64 and pushes it to
# ghcr.io/jonfila/rallly. Runs on pushes to the `iais` branch and on demand.
on:
  push:
    branches: ["iais"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jonfila/rallly
          tags: |
            type=raw,value=iais
            type=sha,prefix=iais-
      - uses: docker/build-push-action@v5
        with:
          file: ./apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=4.13.0-iais
            SELF_HOSTED=true
